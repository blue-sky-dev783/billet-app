<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billet App - 表紙</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 穏やかな自然の風景画像（Unsplash） */
      background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.45)),
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .cover-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 3rem 2.5rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      max-width: 480px;
      width: 90%;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.9;
      margin-bottom: 2.5rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* 各ボタンのカラー設定 */
    .btn-new {
      background-color: #2e8b57; /* 落ち着いたグリーン */
    }
    .btn-new:hover {
      background-color: #267347;
    }

    .btn-history {
      background-color: #4682b4; /* 穏やかなブルー */
    }
    .btn-history:hover {
      background-color: #3a6d96;
    }

    .btn-search {
      background-color: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .btn-search:hover {
      background-color: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>

  <div class="cover-container">
    <h1>Billet App</h1>
    <p class="subtitle">データ管理システム</p>

    <div class="button-group">
      <!-- 遷移先（href）は実際のファイル名やパスに合わせて変更してください -->
      <a href="new.html" class="btn btn-new">
        <span>＋</span> 新規データ
      </a>
      <a href="history.html" class="btn btn-history">
        <span>📁</span> 過去データ
      </a>
      <a href="search.html" class="btn btn-search">
        <span>🔍</span> 検索
      </a>
    </div>
  </div>

</body>
</html>
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ビレット長さ管理</title>

<style>
body{
    font-family:sans-serif;
    margin:10px;
}
h2{
    text-align:center;
}
table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}
th,td{
    border:1px solid #ccc;
    padding:4px;
}
input{
    width:100%;
    box-sizing:border-box;
}
.good{
    background:#c8f7c5;
}
.bad{
    background:#ffcfcf;
}
button{
    padding:10px;
    margin:5px;
}
.summary{
    margin-top:20px;
    font-size:16px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>金属ビレット全長管理表</h2>

<button onclick="addRow()">行追加</button>
<button onclick="saveData()">保存</button>

<table>
<thead>
<tr>
<th>ピットNo</th>
<th>チャージNo</th>
<th>刻印</th>
<th>付加余長</th>
<th>予定寸法</th>
<th>実寸法</th>
<th>差</th>
<th>判定</th>
<th>圧延日</th>
<th>測定日</th>
<th>材質</th>
<th>補正</th>
<th>作業者名</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="summary">
平均差：<span id="avg">0</span> mm<br>
σ（標準偏差）：<span id="sigma">0</span> mm
</div>

<script>

function addRow(){

let tr=document.createElement("tr");

for(let i=0;i<13;i++){

let td=document.createElement("td");
let input=document.createElement("input");

if(i===4 || i===5){
input.type="number";
input.oninput=calc;
}

if(i===8 || i===9){
input.type="date";
}

td.appendChild(input);
tr.appendChild(td);
}

document.getElementById("tbody").appendChild(tr);

}

function calc(){

let rows=document.querySelectorAll("#tbody tr");
let diffs=[];

rows.forEach(row=>{

let planned=parseFloat(row.cells[4].children[0].value)||0;
let actual=parseFloat(row.cells[5].children[0].value)||0;

let diff=actual-planned;

row.cells[6].innerHTML=diff;

let judge=Math.abs(diff)<=5 ? "○" : "×";

row.cells[7].innerHTML=judge;

row.cells[7].className=
judge==="○" ? "good" : "bad";

if(planned!==0 || actual!==0){
diffs.push(diff);
}

});

if(diffs.length===0) return;

let avg=
diffs.reduce((a,b)=>a+b,0)/
diffs.length;

let variance=
diffs.reduce(
(a,b)=>a+Math.pow(b-avg,2),0
)/diffs.length;

let sigma=Math.sqrt(variance);

document.getElementById("avg").innerHTML=
avg.toFixed(2);

document.getElementById("sigma").innerHTML=
sigma.toFixed(2);

}

function saveData(){

let data=[];

document.querySelectorAll("#tbody tr")
.forEach(row=>{

let rowData=[];

for(let i=0;i<13;i++){

if(i===6 || i===7){
rowData.push(row.cells[i].innerText);
}else{
rowData.push(
row.cells[i].children[0].value
);
}

}

data.push(rowData);

});

localStorage.setItem(
"billetData",
JSON.stringify(data)
);

alert("保存しました");

}

function loadData(){

let data=JSON.parse(
localStorage.getItem("billetData")
);

if(!data) return;

data.forEach(r=>{

addRow();

let rows=
document.querySelectorAll("#tbody tr");

let row=
rows[rows.length-1];

for(let i=0;i<13;i++){

if(i!==6 && i!==7){

row.cells[i]
.children[0].value=r[i];

}

}

});

calc();

}

for(let i=0;i<5;i++){
addRow();
}

loadData();

</script>

</body>
</html>
