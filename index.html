<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billet App - 表紙</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 穏やかな自然の風景画像（Unsplash） */
      background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.45)),
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .cover-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 3rem 2.5rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      max-width: 480px;
      width: 90%;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.9;
      margin-bottom: 2.5rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* 各ボタンのカラー設定 */
    .btn-new {
      background-color: #2e8b57; /* 落ち着いたグリーン */
    }
    .btn-new:hover {
      background-color: #267347;
    }

    .btn-history {
      background-color: #4682b4; /* 穏やかなブルー */
    }
    .btn-history:hover {
      background-color: #3a6d96;
    }

    .btn-search {
      background-color: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .btn-search:hover {
      background-color: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>

  <div class="cover-container">
    <h1>Billet App</h1>
    <p class="subtitle">データ管理システム</p>

    <div class="button-group">
      <!-- 遷移先（href）は実際のファイル名やパスに合わせて変更してください -->
      <a href="new.html" class="btn btn-new">
        <span>＋</span> 新規データ
      </a>
      <a href="history.html" class="btn btn-history">
        <span>📁</span> 過去データ
      </a>
      <a href="search.html" class="btn btn-search">
        <span>🔍</span> 検索
      </a>
    </div>
  </div>

</body>
</html>
