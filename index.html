<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビレット長さ管理</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f4f6f8;
      color: #333333;
      min-height: 100vh;
    }

    /* 画面切り替え制御 */
    .screen {
      display: none;
      min-height: 100vh;
    }
    .screen.active {
      display: block;
    }

    /* ===== 表紙画面 ===== */
    #cover-screen.active {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.45)),
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 1rem;
    }

    .cover-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 2.8rem 2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      max-width: 440px;
      width: 100%;
    }

    .cover-container h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .cover-subtitle {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 2.2rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cover-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .cover-btn:active {
      transform: scale(0.98);
    }

    .btn-new {
      background-color: #2e8b57;
    }
    .btn-history {
      background-color: #4682b4;
    }
    .btn-search {
      background-color: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* ===== サブ画面共通ヘッダー・レイアウト ===== */
    .app-header {
      background-color: #2c3e50;
      color: #ffffff;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .app-header h2 {
      font-size: 1.1rem;
      text-align: center;
      flex: 1;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: none;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .content {
      padding: 0.8rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 0.75rem;
      padding-bottom: 0.35rem;
      border-bottom: 2px solid #eef2f5;
    }

    /* ヘッダー情報グリッド */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.75rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #555;
    }

    .form-group input {
      width: 100%;
      padding: 0.55rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .form-group input[readonly] {
      background-color: #f0f4f8;
      font-weight: 700;
      color: #1f4e78;
    }

    /* 入力テーブル */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #ffffff;
      min-width: 640px;
    }

    th, td {
      border: 1px solid #cfd8dc;
      padding: 6px 4px;
      text-align: center;
    }

    th {
      background-color: #eef2f5;
      font-weight: 600;
      white-space: nowrap;
    }

    td input {
      width: 100%;
      padding: 5px 6px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
    }

    .diff-cell {
      font-weight: 700;
      white-space: nowrap;
    }
    .diff-plus { color: #1b6ca8; }
    .diff-minus { color: #c0392b; }

    .row-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .add-row-btn {
      background-color: #4682b4;
      color: #ffffff;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .remove-row-btn {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 0.9rem;
      background-color: #2e8b57;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }

    .history-item {
      border: 1px solid #dce3e8;
      border-radius: 8px;
      padding: 0.85rem;
      margin-bottom: 0.85rem;
      background: #fafcfd;
    }

    .history-meta {
      font-size: 0.82rem;
      line-height: 1.6;
      margin-bottom: 0.6rem;
      color: #222;
    }

    .del-btn {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .empty-msg {
      text-align: center;
      color: #888;
      padding: 2rem 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- 1. 表紙画面 -->
  <div id="cover-screen" class="screen active">
    <div class="cover-container">
      <h1>ビレット長さ管理</h1>
      <p class="cover-subtitle">Billet Length Management</p>

      <div class="button-group">
        <button class="cover-btn btn-new" onclick="showScreen('new-screen')">
          <span>＋</span> 新規データ
        </button>
        <button class="cover-btn btn-history" onclick="showScreen('history-screen')">
          <span>📁</span> 過去データ
        </button>
        <button class="cover-btn btn-search" onclick="showScreen('search-screen')">
          <span>🔍</span> 検索
        </button>
      </div>
    </div>
  </div>

  <!-- 2. 新規データ入力画面 -->
  <div id="new-screen" class="screen">
    <div class="app-header">
      <button class="back-btn" onclick="showScreen('cover-screen')">← 表紙</button>
      <h2>新規データ入力</h2>
      <div style="width: 60px;"></div>
    </div>

    <div class="content">
      <!-- 表の上の項目 -->
      <div class="card">
        <div class="section-title">測定・ロット情報</div>
        <div class="meta-grid">
          <div class="form-group">
            <label for="rolling-date">圧延日</label>
            <input type="date" id="rolling-date">
          </div>
          <div class="form-group">
            <label for="measure-date">測定日</label>
            <input type="date" id="measure-date">
          </div>
          <div class="form-group">
            <label for="material">材質</label>
            <input type="text" id="material" placeholder="例: S45C">
          </div>
          <div class="form-group">
            <label for="correction">補正</label>
            <input type="number" step="any" id="correction" placeholder="例: 0">
          </div>
          <div class="form-group">
            <label for="start-time">開始時間</label>
            <input type="time" id="start-time">
          </div>
          <div class="form-group">
            <label for="end-time">終了時間</label>
            <input type="time" id="end-time">
          </div>
          <div class="form-group">
            <label for="measure-temp">測定温度 (℃)</label>
            <input type="number" step="any" id="measure-temp" placeholder="例: 25">
          </div>
          <div class="form-group">
            <label for="worker1">作業者 1</label>
            <input type="text" id="worker1" placeholder="氏名1">
          </div>
          <div class="form-group">
            <label for="worker2">作業者 2</label>
            <input type="text" id="worker2" placeholder="氏名2">
          </div>
          <div class="form-group">
            <label for="mean-x">平均値（x̄）</label>
            <input type="text" id="mean-x" readonly placeholder="自動計算">
          </div>
          <div class="form-group">
            <label for="sigma-val">σ（標準偏差）</label>
            <input type="text" id="sigma-val" readonly placeholder="自動計算">
          </div>
        </div>
      </div>

      <!-- 複数本まとめて入力できる表 -->
      <div class="card">
        <div class="section-title">ビレット測定表（複数本入力）</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 50px;">No.</th>
                <th>ピットNo.</th>
                <th>チャージNo.</th>
                <th>刻印</th>
                <th>予定寸法</th>
                <th>実寸法</th>
                <th>予定寸法と実寸法の差</th>
                <th style="width: 56px;">削除</th>
              </tr>
            </thead>
            <tbody id="billet-tbody"></tbody>
          </table>
        </div>

        <div class="row-actions">
          <button type="button" class="add-row-btn" onclick="addBilletRow()">＋ 1行追加</button>
          <button type="button" class="add-row-btn" onclick="addBilletRow(5)">＋ 5行追加</button>
        </div>
      </div>

      <button type="button" class="submit-btn" onclick="saveData()">この内容で保存する</button>
    </div>
  </div>

  <!-- 3. 過去データ一覧画面 -->
  <div id="history-screen" class="screen">
    <div class="app-header">
      <button class="back-btn" onclick="showScreen('cover-screen')">← 表紙</button>
      <h2>過去データ一覧</h2>
      <div style="width: 60px;"></div>
    </div>

    <div class="content">
      <div class="card">
        <div id="history-list"></div>
        <p id="history-empty" class="empty-msg">登録されたデータはありません。</p>
      </div>
    </div>
  </div>

  <!-- 4. 検索画面 -->
  <div id="search-screen" class="screen">
    <div class="app-header">
      <button class="back-btn" onclick="showScreen('cover-screen')">← 表紙</button>
      <h2>データ検索</h2>
      <div style="width: 60px;"></div>
    </div>

    <div class="content">
      <div class="card">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="search-keyword">日付・材質・作業者・ピットNo.・チャージNo.・刻印で検索</label>
          <input type="text" id="search-keyword" placeholder="キーワードを入力..." oninput="renderSearch()">
        </div>
      </div>

      <div class="card">
        <div id="search-list"></div>
        <p id="search-empty" class="empty-msg">該当するデータはありません。</p>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'billet_length_records_v2';

    // 初期日付を今日に設定し、最初は10行用意
    const todayStr = new Date().toISOString().slice(0, 10);
    document.getElementById('rolling-date').value = todayStr;
    document.getElementById('measure-date').value = todayStr;
    addBilletRow(10);

    function getRecords() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }

    function setRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'history-screen') {
        renderHistory();
      } else if (screenId === 'search-screen') {
        renderSearch();
      }
    }

    function addBilletRow(count = 1) {
      const tbody = document.getElementById('billet-tbody');
      for (let i = 0; i < count; i++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="row-num"></td>
          <td><input type="text" class="pit-no" placeholder="ピット"></td>
          <td><input type="text" class="charge-no" placeholder="チャージ"></td>
          <td><input type="text" class="stamp-no" placeholder="刻印"></td>
          <td><input type="number" step="any" class="plan-len" oninput="recalcAll()"></td>
          <td><input type="number" step="any" class="actual-len" oninput="recalcAll()"></td>
          <td class="diff-cell">-</td>
          <td><button type="button" class="remove-row-btn" onclick="removeRow(this)">削除</button></td>
        `;
        tbody.appendChild(tr);
      }
      refreshRowNumbers();
      recalcAll();
    }

    function removeRow(btn) {
      const tbody = document.getElementById('billet-tbody');
      if (tbody.rows.length <= 1) {
        alert('最低1行は必要です。');
        return;
      }
      btn.closest('tr').remove();
      refreshRowNumbers();
      recalcAll();
    }

    function refreshRowNumbers() {
      const rows = document.querySelectorAll('#billet-tbody tr');
      rows.forEach((tr, idx) => {
        tr.querySelector('.row-num').textContent = idx + 1;
      });
    }

    function recalcAll() {
      const rows = document.querySelectorAll('#billet-tbody tr');
      const actuals = [];

      rows.forEach(tr => {
        const planVal = parseFloat(tr.querySelector('.plan-len').value);
        const actualVal = parseFloat(tr.querySelector('.actual-len').value);
        const diffCell = tr.querySelector('.diff-cell');

        diffCell.classList.remove('diff-plus', 'diff-minus');

        if (!isNaN(actualVal)) {
          actuals.push(actualVal);
        }

        if (!isNaN(planVal) && !isNaN(actualVal)) {
          const diff = actualVal - planVal;
          const rounded = Math.round(diff * 1000) / 1000;
          diffCell.textContent = (rounded > 0 ? '+' : '') + rounded;
          if (rounded > 0) diffCell.classList.add('diff-plus');
          if (rounded < 0) diffCell.classList.add('diff-minus');
        } else {
          diffCell.textContent = '-';
        }
      });

      const meanInput = document.getElementById('mean-x');
      const sigmaInput = document.getElementById('sigma-val');

      if (actuals.length === 0) {
        meanInput.value = '';
        sigmaInput.value = '';
        return;
      }

      const sum = actuals.reduce((acc, v) => acc + v, 0);
      const mean = sum / actuals.length;
      const variance = actuals.reduce((acc, v) => acc + Math.pow(v - mean, 2), 0) / actuals.length;
      const sigma = Math.sqrt(variance);

      meanInput.value = (Math.round(mean * 1000) / 1000).toString();
      sigmaInput.value = (Math.round(sigma * 1000) / 1000).toString();
    }

    function collectRowsData() {
      const rows = document.querySelectorAll('#billet-tbody tr');
      const items = [];

      rows.forEach(tr => {
        const pitNo = tr.querySelector('.pit-no').value.trim();
        const chargeNo = tr.querySelector('.charge-no').value.trim();
        const stampNo = tr.querySelector('.stamp-no').value.trim();
        const planLen = tr.querySelector('.plan-len').value.trim();
        const actualLen = tr.querySelector('.actual-len').value.trim();
        const diffText = tr.querySelector('.diff-cell').textContent;

        if (pitNo || chargeNo || stampNo || planLen || actualLen) {
          items.push({
            pitNo,
            chargeNo,
            stampNo,
            planLen,
            actualLen,
            diff: diffText
          });
        }
      });

      return items;
    }

    function saveData() {
      const items = collectRowsData();
      if (items.length === 0) {
        alert('表に1本以上のデータを入力してください。');
        return;
      }

      const record = {
        id: Date.now(),
        rollingDate: document.getElementById('rolling-date').value,
        measureDate: document.getElementById('measure-date').value,
        material: document.getElementById('material').value.trim(),
        correction: document.getElementById('correction').value.trim(),
        startTime: document.getElementById('start-time').value,
        endTime: document.getElementById('end-time').value,
        measureTemp: document.getElementById('measure-temp').value.trim(),
        worker1: document.getElementById('worker1').value.trim(),
        worker2: document.getElementById('worker2').value.trim(),
        meanX: document.getElementById('mean-x').value,
        sigma: document.getElementById('sigma-val').value,
        items
      };

      const records = getRecords();
      records.unshift(record);
      setRecords(records);

      // 表をリセット
      document.getElementById('billet-tbody').innerHTML = '';
      addBilletRow(10);

      alert('保存しました！');
      showScreen('history-screen');
    }

    function deleteRecord(id) {
      if (!confirm('この記録を削除しますか？')) return;
      const records = getRecords().filter(r => r.id !== id);
      setRecords(records);
      renderHistory();
    }

    function buildRecordHtml(rec, showDelete) {
      const rowsHtml = rec.items.map((it, idx) => `
        <tr>
          <td>${idx + 1}</td>
          <td>${it.pitNo || '-'}</td>
          <td>${it.chargeNo || '-'}</td>
          <td>${it.stampNo || '-'}</td>
          <td>${it.planLen || '-'}</td>
          <td>${it.actualLen || '-'}</td>
          <td>${it.diff || '-'}</td>
        </tr>
      `).join('');

      return `
        <div class="history-item">
          <div class="history-meta">
            <strong>圧延日:</strong> ${rec.rollingDate || '-'} ／
            <strong>測定日:</strong> ${rec.measureDate || '-'} ／
            <strong>材質:</strong> ${rec.material || '-'} ／
            <strong>補正:</strong> ${rec.correction || '-'}<br>
            <strong>時間:</strong> ${rec.startTime || '-'} 〜 ${rec.endTime || '-'} ／
            <strong>測定温度:</strong> ${rec.measureTemp ? rec.measureTemp + '℃' : '-'} ／
            <strong>作業者:</strong> ${rec.worker1 || '-'}、${rec.worker2 || '-'}<br>
            <strong>平均値(x̄):</strong> ${rec.meanX || '-'} ／
            <strong>σ:</strong> ${rec.sigma || '-'}
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>No.</th>
                  <th>ピットNo.</th>
                  <th>チャージNo.</th>
                  <th>刻印</th>
                  <th>予定寸法</th>
                  <th>実寸法</th>
                  <th>差</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
          ${showDelete ? `<button type="button" class="del-btn" onclick="deleteRecord(${rec.id})">この記録を削除</button>` : ''}
        </div>
      `;
    }

    function renderHistory() {
      const records = getRecords();
      const listEl = document.getElementById('history-list');
      const emptyEl = document.getElementById('history-empty');

      if (records.length === 0) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
      }

      emptyEl.style.display = 'none';
      listEl.innerHTML = records.map(rec => buildRecordHtml(rec, true)).join('');
    }

    function renderSearch() {
      const kw = document.getElementById('search-keyword').value.trim().toLowerCase();
      const records = getRecords();
      const listEl = document.getElementById('search-list');
      const emptyEl = document.getElementById('search-empty');

      const filtered = records.filter(rec => {
        const metaText = [
          rec.rollingDate, rec.measureDate, rec.material, rec.correction,
          rec.startTime, rec.endTime, rec.measureTemp, rec.worker1, rec.worker2
        ].join(' ').toLowerCase();

        const itemText = (rec.items || []).map(it =>
          [it.pitNo, it.chargeNo, it.stampNo, it.planLen, it.actualLen].join(' ')
        ).join(' ').toLowerCase();

        return !kw || metaText.includes(kw) || itemText.includes(kw);
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
      }

      emptyEl.style.display = 'none';
      listEl.innerHTML = filtered.map(rec => buildRecordHtml(rec, false)).join('');
    }
  </script>
</body>
</html>
