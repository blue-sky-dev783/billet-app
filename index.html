<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビレット長さ管理</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f4f6f8;
      color: #333333;
      min-height: 100vh;
    }

    /* 画面切り替え制御 */
    .screen {
      display: none;
      min-height: 100vh;
    }
    .screen.active {
      display: block;
    }

    /* ===== 表紙画面 ===== */
    #cover-screen.active {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.45)),
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 1rem;
    }

    .cover-container {
      text-align: center;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 2.8rem 2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      max-width: 440px;
      width: 100%;
    }

    .cover-container h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .cover-subtitle {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 2.2rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cover-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .cover-btn:active {
      transform: scale(0.98);
    }

    .btn-new {
      background-color: #2e8b57;
    }
    .btn-history {
      background-color: #4682b4;
    }
    .btn-search {
      background-color: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* ===== サブ画面共通ヘッダー・レイアウト ===== */
    .app-header {
      background-color: #2c3e50;
      color: #ffffff;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .app-header h2 {
      font-size: 1.1rem;
      text-align: center;
      flex: 1;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: none;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .content {
      padding: 1rem;
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 0.9rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: #555;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.65rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      background-color: #2e8b57;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    /* テーブル */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #ffffff;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px 6px;
      text-align: center;
    }

    th {
      background-color: #eef2f5;
      font-weight: 600;
    }

    .del-btn {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .empty-msg {
      text-align: center;
      color: #888;
      padding: 2rem 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- 1. 表紙画面 -->
  <div id="cover-screen" class="screen active">
    <div class="cover-container">
      <h1>ビレット長さ管理</h1>
      <p class="cover-subtitle">Billet Length Management</p>

      <div class="button-group">
        <button class="cover-btn btn-new" onclick="showScreen('new-screen')">
          <span>＋</span> 新規データ
        </button>
        <button class="cover-btn btn-history" onclick="showScreen('history-screen')">
          <span>📁</span> 過去データ
        </button>
        <button class="cover-btn btn-search" onclick="showScreen('search-screen')">
          <span>🔍</span> 検索
        </button>
      </div>
    </div>
  </div>

  <!-- 2. 新規データ入力画面 -->
  <div id="new-screen" class="screen">
    <div class="app-header">
      <button class="back-btn" onclick="showScreen('cover-screen')">← 表紙</button>
      <h2>新規データ登録</h2>
      <div style="width: 60px;"></div>
    </div>

    <div class="content">
      <div class="card">
        <div class="form-group">
          <label for="input-date">日付</label>
          <input type="date" id="input-date">
        </div>
        <div class="form-group">
          <label for="input-lot">ロットNo. / 品番</label>
          <input type="text" id="input-lot" placeholder="例: B-2026-01">
        </div>
        <div class="form-group">
          <label for="input-length">ビレット長さ (mm)</label>
          <input type="number" id="input-length" placeholder="例: 1250">
        </div>
        <div class="form-group">
          <label for="input-count">本数</label>
          <input type="number" id="input-count" placeholder="例: 10">
        </div>
        <div class="form-group">
          <label for="input-memo">備考</label>
          <input type="text" id="input-memo" placeholder="メモがあれば入力">
        </div>
        <button class="submit-btn" onclick="saveData()">保存する</button>
      </div>
    </div>
  </div>

  <!-- 3. 過去データ一覧画面 -->
  <div id="history-screen" class="screen">
    <div class="app-header">
      <button class="back-btn" onclick="showScreen('cover-screen')">← 表紙</button>
      <h2>過去データ一覧</h2>
      <div style="width: 60px;"></div>
    </div>

    <div class="content">
      <div class="card" style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>ロットNo.</th>
              <th>長さ(mm)</th>
              <th>本数</th>
              <th>備考</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="history-tbody"></tbody>
        </table>
        <p id="history-empty" class="empty-msg">登録されたデータはありません。</p>
      </div>
    </div>
  </div>

  <!-- 4. 検索画面 -->
  <div id="search-screen" class="screen">
    <div class="app-header">
      <button class="back-btn" onclick="showScreen('cover-screen')">← 表紙</button>
      <h2>データ検索</h2>
      <div style="width: 60px;"></div>
    </div>

    <div class="content">
      <div class="card">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="search-keyword">日付・ロットNo.・長さ・備考で検索</label>
          <input type="text" id="search-keyword" placeholder="キーワードを入力..." oninput="renderSearch()">
        </div>
      </div>

      <div class="card" style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>ロットNo.</th>
              <th>長さ(mm)</th>
              <th>本数</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody id="search-tbody"></tbody>
        </table>
        <p id="search-empty" class="empty-msg">該当するデータはありません。</p>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'billet_app_records';

    // 初期日付を今日に設定
    document.getElementById('input-date').valueAsDate = new Date();

    function getRecords() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }

    function setRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'history-screen') {
        renderHistory();
      } else if (screenId === 'search-screen') {
        renderSearch();
      }
    }

    function saveData() {
      const date = document.getElementById('input-date').value;
      const lot = document.getElementById('input-lot').value.trim();
      const length = document.getElementById('input-length').value.trim();
      const count = document.getElementById('input-count').value.trim();
      const memo = document.getElementById('input-memo').value.trim();

      if (!date || !lot || !length) {
        alert('日付・ロットNo.・ビレット長さは必須です。');
        return;
      }

      const records = getRecords();
      records.unshift({
        id: Date.now(),
        date,
        lot,
        length,
        count: count || '-',
        memo: memo || ''
      });
      setRecords(records);

      // 入力欄クリア
      document.getElementById('input-lot').value = '';
      document.getElementById('input-length').value = '';
      document.getElementById('input-count').value = '';
      document.getElementById('input-memo').value = '';

      alert('保存しました！');
      showScreen('history-screen');
    }

    function deleteRecord(id) {
      if (!confirm('このデータを削除しますか？')) return;
      const records = getRecords().filter(item => item.id !== id);
      setRecords(records);
      renderHistory();
    }

    function renderHistory() {
      const records = getRecords();
      const tbody = document.getElementById('history-tbody');
      const emptyMsg = document.getElementById('history-empty');
      tbody.innerHTML = '';

      if (records.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      records.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.date}</td>
          <td>${item.lot}</td>
          <td>${item.length}</td>
          <td>${item.count}</td>
          <td>${item.memo}</td>
          <td><button class="del-btn" onclick="deleteRecord(${item.id})">削除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderSearch() {
      const keyword = document.getElementById('search-keyword').value.trim().toLowerCase();
      const records = getRecords();
      const tbody = document.getElementById('search-tbody');
      const emptyMsg = document.getElementById('search-empty');
      tbody.innerHTML = '';

      const filtered = records.filter(item =>
        item.date.toLowerCase().includes(keyword) ||
        item.lot.toLowerCase().includes(keyword) ||
        String(item.length).includes(keyword) ||
        item.memo.toLowerCase().includes(keyword)
      );

      if (filtered.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.date}</td>
          <td>${item.lot}</td>
          <td>${item.length}</td>
          <td>${item.count}</td>
          <td>${item.memo}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
