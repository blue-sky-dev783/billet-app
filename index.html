<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビレット長さ管理</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f2f5f8;
      color: #2c353d;
      min-height: 100vh;
    }

    /* 画面切り替え制御 */
    .screen {
      display: none;
      min-height: 100vh;
    }
    .screen.active {
      display: block;
    }

    /* ===== 表紙画面（イラストが見やすいレイアウト） ===== */
    #cover-screen.active {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      background-image: linear-gradient(
                          to bottom,
                          rgba(15, 25, 35, 0.52) 0%,
                          rgba(15, 25, 35, 0.10) 35%,
                          rgba(15, 25, 35, 0.12) 65%,
                          rgba(15, 25, 35, 0.62) 100%
                        ),
                        url('IMG_8b01f5e2-4be6-4879-a7f5-1e659f000a9d.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 1.5rem 1rem 1.8rem;
    }

    .cover-header {
      text-align: center;
      background: rgba(20, 30, 40, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 0.9rem 1.6rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .cover-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 0.15rem;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .cover-subtitle {
      font-size: 0.85rem;
      opacity: 0.92;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
    }

    .cover-controls {
      width: 100%;
      max-width: 540px;
      background: rgba(20, 30, 40, 0.48);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 1rem;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .button-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
    }

    @media (max-width: 480px) {
      .button-group {
        grid-template-columns: 1fr;
        gap: 0.55rem;
      }
      .cover-btn {
        padding: 0.78rem 1rem !important;
        font-size: 1rem !important;
      }
    }

    .cover-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      padding: 0.85rem 0.6rem;
      font-size: 0.98rem;
      font-weight: 700;
      color: #ffffff;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      transition: transform 0.18s ease, background-color 0.18s ease;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    }

    .cover-btn:active {
      transform: scale(0.97);
    }

    .btn-new {
      background-color: rgba(46, 139, 87, 0.92);
    }
    .btn-history {
      background-color: rgba(70, 130, 180, 0.92);
    }
    .btn-search {
      background-color: rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.55);
    }

    /* ===== サブ画面共通ヘッダー・レイアウト ===== */
    .app-header {
      background-color: #243447;
      color: #ffffff;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .app-header h2 {
      font-size: 1.1rem;
      text-align: center;
      flex: 1;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .content {
      padding: 0.85rem;
      max-width: 1280px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 1.1rem;
      box-shadow: 0 2px 10px rgba(36, 52, 71, 0.06);
      margin-bottom: 1rem;
      border: 1px solid #e4e9ef;
    }

    /* 音声入力コントロールバー */
    .voice-bar {
      background: #eef5fb;
      border: 1px solid #c5dcf0;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .voice-buttons {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .voice-btn {
      flex: 1;
      min-width: 180px;
      padding: 0.7rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: background-color 0.2s ease;
    }

    .voice-btn-single {
      background-color: #2b6cb0;
    }

    .voice-btn-batch {
      background-color: #d97706;
    }

    .voice-btn.recording {
      background-color: #dc2626 !important;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.72; }
      100% { opacity: 1; }
    }

    .voice-status {
      font-size: 0.82rem;
      color: #334e68;
      line-height: 1.45;
    }

    .section-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: #243447;
      margin-bottom: 0.85rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid #e8eef4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .section-note {
      font-size: 0.78rem;
      font-weight: 500;
      color: #5c6b7a;
    }

    /* ヘッダー情報グリッド */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 0.8rem;
    }

    .form-group.span-2 {
      grid-column: span 2;
    }

    @media (max-width: 600px) {
      .form-group.span-2 {
        grid-column: span 1;
      }
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.28rem;
      color: #495664;
    }

    .form-group input {
      width: 100%;
      padding: 0.58rem 0.65rem;
      border: 1px solid #c5d0dc;
      border-radius: 7px;
      font-size: 0.95rem;
      background-color: #ffffff;
    }

    .form-group input:focus,
    td input:focus {
      outline: none;
      border-color: #2b6cb0;
      box-shadow: 0 0 0 2px rgba(43, 108, 176, 0.22);
    }

    .form-group input[readonly] {
      background-color: #eef3f8;
      font-weight: 700;
      color: #1c4973;
    }

    /* 入力テーブル */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #ffffff;
      min-width: 920px;
    }

    th, td {
      border: 1px solid #cbd5e0;
      padding: 6px 4px;
      text-align: center;
    }

    th {
      background-color: #edf2f7;
      font-weight: 600;
      color: #243447;
      white-space: nowrap;
    }

    td input {
      width: 100%;
      padding: 5px 6px;
      border: 1px solid #cfd8e3;
      border-radius: 5px;
      font-size: 13px;
      text-align: center;
    }

    td input.inherited-plan {
      background-color: #f4f8fc;
      color: #3b6998;
    }

    .diff-cell {
      font-weight: 700;
      white-space: nowrap;
    }
    .diff-plus { color: #1b6ca8; }
    .diff-minus { color: #c0392b; }

    .row-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }

    .add-row-btn {
      background-color: #4682b4;
      color: #ffffff;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 7px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .remove-row-btn {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 0.95rem;
      background-color: #2e8b57;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(46, 139, 87, 0.25);
    }

    .history-item {
      border: 1px solid #d9e2ec;
      border-radius: 10px;
      padding: 0.9rem;
      margin-bottom: 0.9rem;
      background: #f9fbfd;
    }

    .history-meta {
      font-size: 0.83rem;
      line-height: 1.7;
      margin-bottom: 0.65rem;
      color: #243447;
    }

    .del-btn {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 0.55rem;
    }

    .empty-msg {
      text-align: center;
      color: #888;
      padding: 2rem 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- 1. 表紙画面 -->
  <div id="cover-screen" class="screen active">
    <div class="cover-header">
      <h1>ビレット長さ管理</h1>
      <p class="cover-subtitle">Billet Length Management</p>
    </div>

    <div class="cover-controls">
      <div class="button-group">
        <button class="cover-btn btn-new" onclick="showScreen('new-screen')">
          <span>＋</span> 新規データ
        </button>
        <button class="cover-btn btn-history" onclick="showScreen('history-screen')">
          <span>📁</span> 過去データ
        </button>
        <button class="cover-btn btn-search" onclick="showScreen('search-screen')">
          <span>🔍</span> 検索
        </button>
      </div>
    </div>
  </div>

  <!-- 2. 新規データ入力画面 -->
  <div id="new-screen" class="screen">
    <div class="app-header">
      <button class="back-btn" onclick="showScreen('cover-screen')">← 表紙</button>
      <h2>新規データ入力</h2>
      <div style="width: 60px;"></div>
    </div>

    <div class="content">
      <!-- 音声入力バー -->
      <div class="voice-bar">
        <div class="voice-buttons">
          <button type="button" id="btn-voice-single" class="voice-btn voice-btn-single" onclick="toggleVoiceInput('single')">
            🎙 選択欄に音声入力
          </button>
          <button type="button" id="btn-voice-batch" class="voice-btn voice-btn-batch" onclick="toggleVoiceInput('batch')">
            📏 実測寸法を連続音声入力
          </button>
        </div>
        <div id="voice-status" class="voice-status">
          入力したい欄をタップしてから「選択欄に音声入力」、または「実測寸法を連続音声入力」を押して数値（例: 1250）を話してください。
        </div>
      </div>

      <!-- 測定・ロット情報 -->
      <div class="card">
        <div class="section-title">
          <span>測定・ロット情報</span>
          <span class="section-note">平均値(x̄)・σは実測寸法から自動計算</span>
        </div>
        <div class="meta-grid">
          <div class="form-group">
            <label for="rolling-date">圧延日</label>
            <input type="date" id="rolling-date">
          </div>
          <div class="form-group">
            <label for="measure-date">測定日</label>
            <input type="date" id="measure-date">
          </div>
          <div class="form-group">
            <label for="material">材質</label>
            <input type="text" id="material" placeholder="例: S45C">
          </div>
          <div class="form-group">
            <label for="mold">鋳型</label>
            <input type="text" id="mold" placeholder="例: M-01">
          </div>
          <div class="form-group">
            <label for="crop-type">クロップ区分</label>
            <input type="text" id="crop-type" placeholder="例: A / B">
          </div>
          <div class="form-group">
            <label for="tolerance">交差</label>
            <input type="text" id="tolerance" placeholder="例: ±5">
          </div>
          <div class="form-group">
            <label for="out-of-tolerance">交差外れ</label>
            <input type="text" id="out-of-tolerance" placeholder="例: なし / 1本">
          </div>
          <div class="form-group">
            <label for="target-allowance">狙い代</label>
            <input type="number" step="any" id="target-allowance" placeholder="例: 10">
          </div>
          <div class="form-group">
            <label for="correction">補正</label>
            <input type="number" step="any" id="correction" placeholder="例: 0">
          </div>
          <div class="form-group">
            <label for="start-time">開始時間</label>
            <input type="time" id="start-time">
          </div>
          <div class="form-group">
            <label for="end-time">終了時間</label>
            <input type="time" id="end-time">
          </div>
          <div class="form-group">
            <label for="measure-temp">測定温度 (℃)</label>
            <input type="number" step="any" id="measure-temp" placeholder="例: 25">
          </div>
          <div class="form-group">
            <label for="worker1">作業者 1</label>
            <input type="text" id="worker1" placeholder="氏名1">
          </div>
          <div class="form-group">
            <label for="worker2">作業者 2</label>
            <input type="text" id="worker2" placeholder="氏名2">
          </div>
          <div class="form-group">
            <label for="mean-x">平均値（x̄）</label>
            <input type="text" id="mean-x" readonly placeholder="自動計算">
          </div>
          <div class="form-group">
            <label for="sigma-val">σ（標準偏差）</label>
            <input type="text" id="sigma-val" readonly placeholder="自動計算">
          </div>
          <div class="form-group span-2">
            <label for="remarks">備考</label>
            <input type="text" id="remarks" placeholder="特記事項・連絡事項など">
          </div>
        </div>
      </div>

      <!-- 複数本まとめて入力できる表 -->
      <div class="card">
        <div class="section-title">
          <span>ビレット測定表（複数本入力）</span>
          <span class="section-note">予定寸法が空欄の行は直前の予定寸法を自動適用して計算</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 46px;">No.</th>
                <th>ピットNo.</th>
                <th>チャージNo.</th>
                <th>圧延サイズ</th>
                <th>刻印</th>
                <th>メモ</th>
                <th>予定寸法</th>
                <th>実測寸法</th>
                <th>実測寸法Wチェック</th>
                <th>予定寸法と実寸法の差</th>
                <th style="width: 54px;">削除</th>
              </tr>
            </thead>
            <tbody id="billet-tbody"></tbody>
          </table>
        </div>

        <div class="row-actions">
          <button type="button" class="add-row-btn" onclick="addBilletRow()">＋ 1行追加</button>
          <button type="button" class="add-row-btn" onclick="addBilletRow(5)">＋ 5行追加</button>
        </div>
      </div>

      <button type="button" class="submit-btn" onclick="saveData()">この内容で保存する</button>
    </div>
  </div>

  <!-- 3. 過去データ一覧画面 -->
  <div id="history-screen" class="screen">
    <div class="app-header">
      <button class="back-btn" onclick="showScreen('cover-screen')">← 表紙</button>
      <h2>過去データ一覧</h2>
      <div style="width: 60px;"></div>
    </div>

    <div class="content">
      <div class="card">
        <div id="history-list"></div>
        <p id="history-empty" class="empty-msg">登録されたデータはありません。</p>
      </div>
    </div>
  </div>

  <!-- 4. 検索画面 -->
  <div id="search-screen" class="screen">
    <div class="app-header">
      <button class="back-btn" onclick="showScreen('cover-screen')">← 表紙</button>
      <h2>データ検索</h2>
      <div style="width: 60px;"></div>
    </div>

    <div class="content">
      <div class="card">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="search-keyword">日付・材質・鋳型・クロップ区分・備考・作業者・ピットNo.・チャージNo.・刻印・メモで検索</label>
          <input type="text" id="search-keyword" placeholder="キーワードを入力..." oninput="renderSearch()">
        </div>
      </div>

      <div class="card">
        <div id="search-list"></div>
        <p id="search-empty" class="empty-msg">該当する
